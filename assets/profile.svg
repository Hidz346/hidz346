<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="1177.0" viewBox="0 0 1180 1177.0" role="img" aria-labelledby="title desc">
  <title id="title">SYAHID SUBHAN PUTRA — GitHub profile</title>
  <desc id="desc">Animated terminal-inspired developer profile card.</desc>
  <defs>
    <linearGradient id="bgGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#49e6ff" stop-opacity="0.10"/>
      <stop offset="0.48" stop-color="#070b12" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffb454" stop-opacity="0.08"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#172335" stroke-width="1"/>
    </pattern>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8cf3ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#8cf3ff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#8cf3ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="artClip"><rect x="28" y="82" width="380" height="988" rx="16"/></clipPath>
    <style>
      .mono { font-family: "SFMono-Regular", "Cascadia Code", "Roboto Mono", Consolas, monospace; }
      .ascii { font-family: "Courier New", monospace; font-size: 11.1px; fill: #8cf3ff; white-space: pre; opacity: 1; animation: reveal .35s steps(1) forwards; }
      .field { opacity: 1; animation: reveal .35s steps(1) forwards; }
      .label { font: 700 12px "SFMono-Regular", Consolas, monospace; fill: #718096; letter-spacing: 1.2px; }
      .value { font: 500 15px "SFMono-Regular", Consolas, monospace; fill: #e8f0f7; }
      .stat { opacity: 1; animation: reveal .35s steps(1) forwards; }
      .stat-label { font: 700 10px "SFMono-Regular", Consolas, monospace; fill: #718096; letter-spacing: 1.3px; }
      .stat-value { font: 700 25px "SFMono-Regular", Consolas, monospace; fill: #8cf3ff; }
      .command { font: 600 16px "SFMono-Regular", Consolas, monospace; fill: #8cf3ff; }
      .cursor { fill: #49e6ff; filter: url(#softGlow); }
      .scanline { animation: scan 4.8s linear infinite; }
      .pulse { animation: pulse 2.4s ease-in-out infinite; transform-origin: center; }
      @keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } } .cursor { animation: blink 1s steps(1) infinite; }
      @keyframes reveal { from { opacity: .35; } to { opacity: 1; } }
      @keyframes scan { from { transform: translateY(0); } to { transform: translateY(1107.0px); } }
      @keyframes pulse { 0%,100% { opacity: .35; } 50% { opacity: .85; } }
      @media (prefers-reduced-motion: reduce) { .ascii,.field,.stat,.scanline,.pulse,.cursor,.command { animation: none !important; opacity: 1 !important; } }
    </style>
    
  </defs>

  <rect width="1180" height="1177.0" rx="18" fill="#070b12"/>
  <rect width="1180" height="1177.0" rx="18" fill="url(#bgGlow)"/>
  <rect x="1" y="1" width="1178" height="1175.0" rx="17" fill="none" stroke="#26354b"/>
  <rect x="20" y="20" width="1140" height="1137.0" rx="13" fill="url(#grid)" opacity="0.58"/>

  <!-- Window chrome -->
  <rect x="20" y="20" width="1140" height="42" rx="13" fill="#0c121c" stroke="#26354b"/>
  <circle cx="45" cy="41" r="6" fill="#ff5f57"/>
  <circle cx="66" cy="41" r="6" fill="#febc2e"/>
  <circle cx="87" cy="41" r="6" fill="#28c840"/>
  <text x="590" y="46" text-anchor="middle" class="mono" font-size="12" fill="#718096">your-username@github: ~/profile</text>

  <!-- Identity -->
  <text x="54" y="96" class="mono" font-size="11" font-weight="700" fill="#49e6ff" letter-spacing="2">PROFILE / 001</text>
  <text x="470" y="98" class="mono" font-size="29" font-weight="800" fill="#e8f0f7">SYAHID SUBHAN PUTRA</text>
  <text x="470" y="122" class="mono" font-size="13" fill="#49e6ff" letter-spacing="1.4">WEB DEVELOPER &amp; SECURITY ENTHUSIAST</text>

